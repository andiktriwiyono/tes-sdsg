<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Antrian Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500">
  <div class="min-h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full">
      <!-- Logo/Header -->
      <div class="text-center mb-8">
        <div class="bg-white w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg">
          <span class="text-4xl">🎓</span>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">Sistem Antrian Test</h1>
        <p class="text-white/80">Silakan login untuk melanjutkan</p>
      </div>

      <!-- Login Form -->
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <form id="login-form">
          <div class="mb-6">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
            <input 
              type="text" 
              id="username" 
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
              placeholder="Masukkan username"
            />
          </div>

          <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input 
              type="password" 
              id="password" 
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
              placeholder="Masukkan password"
            />
          </div>

          <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>

          <button 
            type="submit" 
            id="login-btn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            Login
          </button>
        </form>


      </div>

      <p class="text-center text-white/60 text-sm mt-6">
        © 2024 Sistem Antrian Test
      </p>
    </div>
  </div>

  <script>
    // Check if already logged in
    const currentUser = localStorage.getItem('currentUser');
    if (currentUser) {
      window.location.href = '/';
    }

    const USERS_API_URL = window.location.hostname === 'localhost' 
      ? '/api/users' 
      : '/.netlify/functions/users';

    // Get users from database
    async function getUsers() {
      try {
        const response = await fetch(USERS_API_URL);
        const users = await response.json();
        return users;
      } catch (error) {
        console.error('Error loading users:', error);
        return [];
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      const loginBtn = document.getElementById('login-btn');

      // Disable button while loading
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="animate-pulse">⏳</span> Loading...';

      try {
        // Get users from database
        const users = await getUsers();

        // Find user
        const user = users.find(u => u.username === username && u.password === password);

        if (user) {
          // Save to localStorage
          const userData = {
            username: user.username,
            role: user.role,
            name: user.name,
            loginTime: new Date().toISOString()
          };
          localStorage.setItem('currentUser', JSON.stringify(userData));
          
          // Redirect to main page
          window.location.href = '/';
        } else {
          errorMsg.textContent = '❌ Username atau password salah!';
          errorMsg.classList.remove('hidden');
          
          setTimeout(() => {
            errorMsg.classList.add('hidden');
          }, 3000);
        }
      } catch (error) {
        errorMsg.textContent = '❌ Error: ' + error.message;
        errorMsg.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg> Login';
      }
    });
  </script>
</body>
</html>
